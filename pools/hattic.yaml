pool: hattic
source_citation: "Soysal, O. (2004). Hattischer Wortschatz in hethitischer\n  Textüberlieferung.\
  \ HdO I/74. Leiden: Brill. — the standard Hattic\n  lexicon; primary reference for\
  \ the lexemes.\nKlinger, J. (1996). Untersuchungen zur Rekonstruktion der hattischen\n\
  \  Kultschicht. StBoT 37. Wiesbaden: Harrassowitz.\nKammenhuber, A. (1969). 'Hattisch.'\
  \ HdO I/2.1-2/2: 428-546.\nTaracha, P. (2009). Religions of Second Millennium Anatolia.\
  \ DBH 27.\ndel Monte, G. F. & Tischler, J. (1978). RGTC 6 (toponyms).\nBischoff,\
  \ A. M. (2023). Hungarian Assyriological Review 4: 95-109.\nUnderlying Hittite-archive\
  \ tablets (CTH 725-745 and Hattic passages in\n  Hittite ritual / festival texts)\
  \ are Bronze Age, public domain. Manual\n  lexical transcription via scripts/build_hattic_corpus.py;\
  \ forms not\n  collated against the printed editions (see corpora/hattic.README.md).\n"
license: 'Cited fair-use of the scholarly literature for the lexical forms and

  glosses. Underlying tablets PD.

  '
